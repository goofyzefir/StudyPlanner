{% extends "base.html" %}
{% block content %}
<h2>Забыли пароль?</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <p>{{ form.email.label }}<br>{{ form.email() }}</p>
    <button type="submit" class="btn">Отправить ссылку</button>
</form>
<p><a href="{{ url_for('main.login') }}">Вернуться ко входу</a></p>
{% endblock %}
