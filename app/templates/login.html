{% extends "base.html" %}
{% block content %}
<h2>Вход</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <p>{{ form.email.label }}<br>{{ form.email() }}</p>
    <p>{{ form.password.label }}<br>{{ form.password() }}</p>
    <button type="submit" class="btn">Войти</button>
</form>
<p><a href="{{ url_for('main.forgot_password') }}">Забыли пароль?</a></p>
<p><a href="{{ url_for('main.register') }}">Нет аккаунта? Зарегистрируйтесь</a></p>
{% endblock %}
